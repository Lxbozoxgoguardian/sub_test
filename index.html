<!DOCTYPE html>
<html>
<head>
<style>
  /* Ensure html and body take up the full page and remove default margins/padding */
  html, body {
    margin: 0px;
    padding: 0px;
    height: 100%;
    overflow: hidden; /* Hides scrollbars on the main page */
  }

  /* Style the iframe to cover the entire container (the body in this case) */
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none; /* Removes the default iframe border */
    overflow-y: auto; /* Allows vertical scrolling within the iframe if needed */
    overflow-x: hidden; /* Hides horizontal scrollbar within the iframe */
    position: fixed; /* Positions the iframe relative to the browser window */
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }
</style>
</head>
<body>

<iframe src="https://secure-stream-browser--leocherubino2.replit.app/" title="W3Schools Website">
  Your browser does not support iframes.
</iframe>

</body>
</html>
